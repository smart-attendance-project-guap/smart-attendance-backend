name: Backend build

on:
  push:
    branches: [feature-backend, feature-backend-ci]
  pull_request:
    branches: [feature-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts
      - name: Build Backend
        run: npm run build
